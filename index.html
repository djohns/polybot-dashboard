<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Polymarket Bot</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f6f8; --surface: #fff; --border: #dde1e7; --text: #17202c;
          --muted: #566171; --accent: #16805f; --danger: #b1332b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151d; --surface: #171d27; --border: #2a323e; --text: #e7ebf1; --muted: #9aa4b4;
            --accent: #3ecf9a; --danger: #e2665d; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--text); font: 15px -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  form { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
         width: 100%; max-width: 340px; display: grid; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  input[type=password] { font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
                         background: var(--bg); color: var(--text); }
  label { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px;
           background: var(--accent); color: #fff; cursor: pointer; }
  .error { color: var(--danger); font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Polymarket Bot</h1>
  <p>Dashboard cifrado. Ingresa la contraseña para verlo.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" required autofocus />
  <label><input id="remember" type="checkbox" checked /> Recordar en este dispositivo</label>
  <button type="submit">Abrir</button>
  <div class="error" id="err"></div>
</form>
